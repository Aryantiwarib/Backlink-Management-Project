name: LINKORA CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Code Quality & Linting
  # ---------------------------------------------------------------------------
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ---------------------------------------------------------------------------
  # 2. Automated Unit & Integration Tests
  # ---------------------------------------------------------------------------
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm --prefix server ci

      - name: Run Backend Unit Tests
        env:
          NODE_ENV: test
          SESSION_SECRET: ci_test_session_secret_2026
        run: npm run test:unit

      - name: Run Supertest API Integration Tests
        env:
          NODE_ENV: test
          SESSION_SECRET: ci_test_session_secret_2026
        run: npm run test:integration

  # ---------------------------------------------------------------------------
  # 3. Frontend Production Build Verification
  # ---------------------------------------------------------------------------
  build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm --prefix client ci

      - name: Build Vite Production Bundle
        env:
          VITE_API_URL: /api
          VITE_BACKEND_URL: ''
        run: npm --prefix client run build

      - name: Upload Production Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-production-dist
          path: client/dist/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 4. Docker Container Build Verification
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Container
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: linkora-server:ci-test

      - name: Build Client Container
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: linkora-client:ci-test

  # ---------------------------------------------------------------------------
  # 5. Security & Vulnerability Scan (Trivy)
  # ---------------------------------------------------------------------------
  security:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: 'latest'

      - name: Run Trivy Repository Scan
        run: |
          trivy fs --format table --exit-code 0 --ignore-unfixed --severity CRITICAL,HIGH .
