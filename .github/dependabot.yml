version: 2
updates:
  # Root dependencies (concurrently, test tools, linters)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    target-branch: "develop"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "root"

  # Client dependencies (React, Vite, Tailwind, Recharts)
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    target-branch: "develop"
    commit-message:
      prefix: "chore(deps-client)"
    labels:
      - "dependencies"
      - "client"

  # Server dependencies (Express, Mongoose, Passport, OpenAI)
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    target-branch: "develop"
    commit-message:
      prefix: "chore(deps-server)"
    labels:
      - "dependencies"
      - "server"

  # GitHub Actions CI/CD workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    target-branch: "develop"
    commit-message:
      prefix: "ci(actions)"
    labels:
      - "ci/cd"
      - "github-actions"

  # Dockerfile base images (Node, Nginx)
  - package-ecosystem: "docker"
    directory: "/client"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    commit-message:
      prefix: "chore(docker-client)"

  - package-ecosystem: "docker"
    directory: "/server"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    commit-message:
      prefix: "chore(docker-server)"
